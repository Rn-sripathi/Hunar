# Render blueprint for the API.
#
# Two settings here are load-bearing rather than conventional:
#
# `numInstances: 1` is required, not an economy. Reconciliation runs
# in-process, so a second instance would poll the same calls twice. The
# honest fix for real scale is a separate worker holding a lock, which is
# out of scope here and is written up in the README.
#
# The Starter plan rather than Free is also deliberate. A free instance
# sleeps when idle, and a sleeping instance both drops inbound webhooks
# and freezes the reconciler that live call status depends on. The demo
# would appear to hang for the first person to open it after a quiet hour.

services:
  - type: web
    name: hunar-api
    runtime: python
    plan: starter
    region: singapore # closest to Indian mobile numbers and to Neon ap-southeast
    numInstances: 1
    rootDir: .
    healthCheckPath: /healthz

    buildCommand: |
      pip install --upgrade pip uv
      uv sync --all-packages --frozen

    # Migrations run before the new build takes traffic, so a request never
    # arrives against a schema that has not been applied yet.
    preDeployCommand: cd apps/api && uv run alembic upgrade head

    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONPATH
        value: /opt/render/project/src/apps/api/src:/opt/render/project/src/packages/hunar-sdk/src
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Set in the dashboard, never here.
      - key: HUNAR_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Reads job descriptions into forms and search filters. Without it
      # both extractors fall back to keyword matching and say so in the
      # UI, so a missing key degrades the product rather than breaking it.
      - key: OPENAI_API_KEY
        sync: false

      # Only numbers listed here can ever be dialled by the sourcing app.
      # Left unset, nothing is callable, which is the correct default for
      # a public deployment holding broker-sourced contact data.
      - key: DEMO_ALLOWLIST
        sync: false

      - key: PDL_API_KEY
        sync: false

      # Starts live and falls back to recorded data when the key expires,
      # saying so in the UI rather than failing silently.
      - key: HUNAR_MODE
        value: auto

      # Deliberately absent. The root of every webhook callback URL is
      # this service's own address, which is not knowable until the
      # service exists, so the app reads Render's own RENDER_EXTERNAL_URL
      # instead. Set PUBLIC_API_BASE_URL explicitly only to override it,
      # such as behind a custom domain.

      # The Vercel domain. A browser treats localhost and 127.0.0.1 as
      # different origins, so production lists only the real one.
      - key: CORS_ORIGINS
        sync: false

      # Defaults to the built-in sample set so the sourcing screens work
      # with no provider account at all. Switch to `pdl` once PDL_API_KEY
      # is set; the two switches are independent of HUNAR_MODE on purpose.
      - key: PEOPLE_PROVIDER
        value: fixture

      - key: LLM_MODEL
        value: gpt-4o
