[project]
name = "hunar-sdk"
version = "0.1.0"
description = "Typed async client, webhook verification and demo-mode fake for the Hunar Voice Agents API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunar_sdk"]
