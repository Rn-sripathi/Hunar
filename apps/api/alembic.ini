[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Filenames are prefixed with a UTC timestamp so migrations sort
# chronologically in a directory listing and in a diff.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally absent. The URL comes from DATABASE_URL
# via the application's own validated settings, so migrations and the app
# can never disagree about which database they are pointing at, and no
# credential is written into a tracked file.

# Generated migrations are formatted so they match the rest of the tree
# and do not fail CI's format check. `exec` rather than `console_scripts`
# because ruff ships as a standalone binary with no entrypoint to resolve.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
